<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Page not found</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center;
         justify-content: center; font-family: Georgia, serif; color: #fff;
         background: linear-gradient(135deg, #1e3c72, #2a5298, #7e57c2); }
  .box { text-align: center; padding: 2rem; }
  h1 { font-size: 8rem; margin: 0; letter-spacing: 0.5rem; }
  p { font-size: 1.6rem; font-style: italic; }
  a { display: inline-block; margin-top: 1rem; padding: 0.7rem 1.6rem;
      border-radius: 2rem; background: #fff; color: #2a5298;
      text-decoration: none; font-family: Arial, sans-serif; }
  a:hover { background: #ffd54f; }
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>Ceci n'est pas une page</p>
    <a href="/">Take me home</a>
  </div>
</body>
</html>
